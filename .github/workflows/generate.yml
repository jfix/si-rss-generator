name: Generate Space Invaders RSS & Markdown

on:
  schedule:
    # Run every 2 hours at minute 0
    - cron: '0 */2 * * *'
  # Allow manual trigger
  workflow_dispatch:

# GitHub Pages publishes straight from main:/docs, so committing the generated
# files is all that's needed to update the site; no separate deploy job.
permissions:
  contents: write

# Never let a manual run and a scheduled run push at the same time.
concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate RSS and Markdown
        run: bun run generate
        env:
          SITE_URL: https://jfix.github.io/si-rss-generator

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/ docs/; then
            echo "No changes detected"
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/news-cache.html docs/feed.xml docs/NEWS.md docs/index.html
          git commit -m "Update Space Invaders news - $(date -u +'%Y-%m-%d')"
          git push
